<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      if (localStorage.getItem("pv_tema") === "escuro") document.documentElement.dataset.theme = "escuro";
    })();
  </script>
  <script src="../assets/js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treinos do aluno — Seklyn</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='128' y2='128' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%234c1d95'/%3E%3Cstop offset='1' stop-color='%232e1065'/%3E%3C/linearGradient%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c4b5fd'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='128' height='128' rx='30' fill='url(%23g)'/%3E%3Ccircle cx='93' cy='35' r='7' fill='url(%23a)'/%3E%3Cpath d='M79 46c0-8-8-13-19-13-12 0-20 6-20 15 0 20 32 12 32 26 0 6-6 10-14 10-9 0-16-4-18-11' stroke='white' stroke-width='9' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/desktop.css" />
</head>
<body>
  <div class="topbar-mobile">
    <button class="botao-hamburguer" type="button" data-acao="abrir-menu" aria-label="Abrir menu">☰</button>
    <span class="marca-texto" style="font-weight:800;">Sek<span class="ponto">lyn</span></span>
    <span style="width:40px;"></span>
  </div>
  <div class="sidebar-overlay"></div>

  <div class="app-personal">
    <aside class="sidebar">
      <div class="sidebar-marca marca-logo">
        <svg width="24" height="24" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="logoGradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#4c1d95" />
              <stop offset="1" stop-color="#2e1065" />
            </linearGradient>
            <linearGradient id="logoAccent" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#c4b5fd" />
              <stop offset="1" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="30" fill="url(#logoGradient)" />
          <circle cx="93" cy="35" r="7" fill="url(#logoAccent)" />
          <path d="M79 46c0-8-8-13-19-13-12 0-20 6-20 15 0 20 32 12 32 26 0 6-6 10-14 10-9 0-16-4-18-11" stroke="white" stroke-width="9" stroke-linecap="round" fill="none" />
        </svg>
        <span class="marca-texto">Sek<span class="ponto">lyn</span></span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link ativo">👥 Alunos</a>
        <a href="recomendacoes.html" class="sidebar-link">🛍️ Recomendações</a>
        <a href="assinatura.html" class="sidebar-link">💳 Assinatura</a>
      </nav>
      <div class="sidebar-rodape">
        <button class="botao-tema" type="button" data-acao="alternar-tema" aria-label="Alternar tema">🌙</button>
        <button class="btn btn-ghost btn-sm" data-acao="sair">Sair</button>
      </div>
    </aside>

    <main class="conteudo-personal">
      <a href="dashboard.html" class="hint-text" style="display:inline-block;margin-bottom:var(--espaco-4);">← Voltar para alunos</a>

      <div class="cabecalho-pagina">
        <div>
          <h1 id="aluno-nome">Carregando...</h1>
          <p>Monte e acompanhe os treinos deste aluno.</p>
        </div>
      </div>

      <div class="card" style="margin-bottom:var(--espaco-6);">
        <div class="cabecalho-pagina" style="margin-bottom:0;">
          <div>
            <strong>Link de acesso do aluno</strong>
            <p class="hint-text" id="aluno-link" style="cursor:pointer;">…</p>
          </div>
          <span class="badge badge-neutro">Clique no link para copiar</span>
        </div>
      </div>

      <div class="card" style="margin-bottom:var(--espaco-6);">
        <h3 style="margin-bottom:var(--espaco-3);">📊 Aderência (últimos 30 dias)</h3>
        <div id="analytics-resumo"><p class="hint-text">Carregando…</p></div>
      </div>

      <h3 style="margin-bottom:var(--espaco-4);">Treinos</h3>

      <form id="form-novo-treino" class="form-row" style="margin-bottom:var(--espaco-5);max-width:480px;">
        <div class="form-group" style="flex:1;">
          <input class="input" name="nome" placeholder="Nome do novo treino (ex: Treino A - Peito e Tríceps)" required />
        </div>
        <div class="form-group" style="flex:0;">
          <button type="submit" class="btn btn-primary">+ Treino</button>
        </div>
      </form>

      <div class="editor-treinos" id="lista-treinos-editor"></div>
    </main>
  </div>

  <script type="module" src="../assets/js/tema.js"></script>
  <script type="module" src="../assets/js/menu.js"></script>
  <script type="module" src="../assets/js/aluno-detalhe.js"></script>
</body>
</html>
