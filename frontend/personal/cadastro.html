<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      if (localStorage.getItem("pv_tema") === "escuro") document.documentElement.dataset.theme = "escuro";
    })();
  </script>
  <script src="../assets/js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Seklyn</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-s.png" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body>
  <div class="tela-auth">
    <div class="blobs-fundo">
      <div class="blob" style="top:-200px;right:-140px;width:480px;height:480px;background:radial-gradient(circle, #8b5cf6 0%, transparent 70%);"></div>
      <div class="blob" style="bottom:-200px;left:-160px;width:520px;height:520px;background:radial-gradient(circle, #4c1d95 0%, transparent 70%);animation-delay:-7s;"></div>
      <div class="blob" style="top:30%;left:50%;width:380px;height:380px;background:radial-gradient(circle, #a78bfa 0%, transparent 70%);animation-delay:-14s;"></div>
    </div>
    <button class="botao-tema botao-tema-flutuante" type="button" data-acao="alternar-tema" aria-label="Alternar tema">🌙</button>
    <div class="card-vidro auth-card">
      <div class="auth-marca">
        <a href="/" class="marca-logo" style="color:inherit;text-decoration:none;">
          <img src="../assets/img/logo-s.png" alt="" width="28" height="28" style="object-fit:contain;" />
          <span class="marca-texto">Sek<span class="ponto">lyn</span></span>
        </a>
      </div>
      <p class="auth-subtitulo">Crie sua conta de Personal Trainer</p>

      <form id="form-cadastro" novalidate>
        <div class="form-erro" hidden></div>

        <div class="form-group">
          <label class="label" for="nome">Nome completo</label>
          <input class="input" type="text" id="nome" name="nome" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="label" for="email">E-mail</label>
          <input class="input" type="email" id="email" name="email" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="label" for="telefone">Telefone (opcional)</label>
          <input class="input" type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(11) 90000-0000" />
        </div>

        <div class="form-group">
          <label class="label" for="senha">Senha</label>
          <input class="input" type="password" id="senha" name="senha" required autocomplete="new-password" minlength="8" />
          <span class="hint-text">Mínimo de 8 caracteres.</span>
        </div>

        <div class="form-group">
          <label class="label" for="confirmar-senha">Confirmar senha</label>
          <input class="input" type="password" id="confirmar-senha" name="confirmar_senha" required autocomplete="new-password" minlength="8" />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
        <p class="hint-text" style="text-align:center;margin-top:var(--espaco-3);">
          Ao criar sua conta, você concorda com os <a href="termos.html">Termos de Uso</a>.
        </p>
      </form>

      <p class="auth-rodape">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <script type="module" src="../assets/js/tema.js"></script>
  <script type="module" src="../assets/js/auth.js"></script>
  <script type="module" src="../assets/js/spotlight.js"></script>
</body>
</html>
