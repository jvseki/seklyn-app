<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      if (localStorage.getItem("pv_tema") === "escuro") document.documentElement.dataset.theme = "escuro";
    })();
  </script>
  <script src="../assets/js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar e-mail — Seklyn</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-s.png" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body>
  <div class="tela-auth">
    <div class="blobs-fundo">
      <div class="blob" style="top:-200px;right:-140px;width:480px;height:480px;background:radial-gradient(circle, #8b5cf6 0%, transparent 70%);"></div>
      <div class="blob" style="bottom:-200px;left:-160px;width:520px;height:520px;background:radial-gradient(circle, #4c1d95 0%, transparent 70%);animation-delay:-7s;"></div>
    </div>
    <button class="botao-tema botao-tema-flutuante" type="button" data-acao="alternar-tema" aria-label="Alternar tema"></button>

    <div class="card-vidro auth-card" style="text-align:center;">
      <div id="estado-carregando">
        <div class="spinner" style="margin-inline:auto;"></div>
        <p class="hint-text" style="margin-top:var(--espaco-4);">Confirmando seu e-mail...</p>
      </div>

      <div id="estado-sucesso" hidden>
        <div style="font-size:2.5rem;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;flex-shrink:0;"><polyline points="20 6 9 17 4 12"/></svg></div>
        <h1 style="margin-top:var(--espaco-3);font-size:1.3rem;">E-mail confirmado!</h1>
        <p class="hint-text" style="margin-top:var(--espaco-2);">Sua conta está com o e-mail verificado.</p>
        <a href="dashboard.html" class="btn btn-primary btn-block" style="margin-top:var(--espaco-5);">Ir para o painel</a>
      </div>

      <div id="estado-erro" hidden>
        <div style="font-size:2.5rem;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;flex-shrink:0;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
        <h1 style="margin-top:var(--espaco-3);font-size:1.3rem;">Link inválido ou expirado</h1>
        <p class="hint-text" style="margin-top:var(--espaco-2);">Faça login e peça um novo e-mail de confirmação no painel.</p>
        <a href="login.html" class="btn btn-secondary btn-block" style="margin-top:var(--espaco-5);">Ir para o login</a>
      </div>
    </div>
  </div>

  <script type="module" src="../assets/js/tema.js"></script>
  <script type="module" src="../assets/js/confirmar-email.js"></script>
</body>
</html>
