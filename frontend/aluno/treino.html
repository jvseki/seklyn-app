<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      if (localStorage.getItem("pv_tema") === "escuro") document.documentElement.dataset.theme = "escuro";
    })();
  </script>
  <script src="../assets/js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu treino — Seklyn</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-s.png" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/mobile.css" />
</head>
<body>
  <div class="app-aluno">

    <div id="carregando" style="display:flex;align-items:center;justify-content:center;flex:1;">
      <div class="spinner"></div>
    </div>

    <div id="erro-link" class="aluno-conteudo" hidden>
      <div class="estado-vazio">
        <div class="icone"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <p>Este link não é válido ou não está mais ativo. Peça um novo link ao seu Personal.</p>
      </div>
    </div>

    <div id="app-conteudo" hidden style="display:flex;flex-direction:column;flex:1;">
      <header class="aluno-topo">
        <div class="aluno-topo-linha">
          <div class="aluno-saudacao">
            <h1 id="saudacao-nome">Olá!</h1>
            <p id="saudacao-personal"></p>
          </div>
          <div style="display:flex;align-items:center;gap:var(--espaco-2);">
            <span class="streak-badge" id="streak-badge" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c0-1-1-2-1-3 2 1 3 3 3 5a5 5 0 0 1-10 0c0-4 3-6 5-10z"/></svg>
              <strong id="streak-numero">0</strong>
            </span>
            <button class="botao-tema" type="button" data-acao="alternar-tema" aria-label="Alternar tema">🌙</button>
          </div>
        </div>
      </header>

      <main class="aluno-conteudo">
        <!-- Lista de treinos -->
        <section id="secao-lista">
          <div class="lista-treinos-aluno" id="lista-treinos-aluno"></div>
        </section>

        <!-- Execução (checklist) de um treino -->
        <section id="secao-execucao" hidden>
          <button class="btn btn-ghost btn-sm" id="botao-voltar-execucao" type="button" style="margin-bottom:var(--espaco-4);">← Voltar aos treinos</button>

          <div class="treino-execucao-cabecalho">
            <h2 id="execucao-titulo">Treino</h2>
            <p class="hint-text" id="execucao-subtitulo" style="margin-top:-4px;margin-bottom:4px;"></p>
            <div class="progresso">
              <div class="progresso-preenchimento" id="execucao-progresso-barra" style="width:0%;"></div>
            </div>
            <p class="hint-text" id="execucao-progresso-texto" style="margin-top:6px;">0% concluído</p>
          </div>

          <div class="faixa-concluido" id="execucao-faixa-concluido" hidden>
            <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;flex-shrink:0;"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 5H4a2 2 0 0 0 2 4"/><path d="M17 5h3a2 2 0 0 1-2 4"/></svg></span>
            <span>Treino concluído! Parabéns.</span>
          </div>

          <div id="execucao-exercicios"></div>
        </section>

        <!-- Recomendações do Personal (aba não-invasiva de afiliados) -->
        <section id="secao-dicas" hidden>
          <div class="dicas-intro">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;flex-shrink:0;"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Produtos e cupons recomendados pelo seu Personal. Totalmente opcional.
          </div>
          <div class="lista-recomendacoes" id="lista-recomendacoes-aluno"></div>
          <div class="estado-vazio" id="estado-vazio-dicas" hidden>
            <div class="icone"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
            <p>Seu Personal ainda não cadastrou nenhuma recomendação.</p>
          </div>
        </section>
      </main>

      <nav class="tab-bar" id="tab-bar">
        <button class="tab-bar-item ativa" id="tab-treinos" type="button">
          <span class="emoji"><img src="../assets/img/halter-aluno.png" alt="" class="tab-bar-icone-img" /></span>
          <span>Treinos</span>
        </button>
        <button class="tab-bar-item" id="tab-dicas" type="button">
          <span class="emoji tab-bar-icone-roxo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;flex-shrink:0;"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
          <span>Recomendações</span>
        </button>
      </nav>
    </div>
  </div>

  <script type="module" src="../assets/js/treino.js"></script>
  <script type="module" src="../assets/js/spotlight.js"></script>
</body>
</html>
