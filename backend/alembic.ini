[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# a URL real vem de app.core.config (via .env) dentro de alembic/env.py —
# este valor aqui é só um fallback e não é usado em runtime.
sqlalchemy.url = postgresql+psycopg2://seklyn:seklyn@localhost:5432/seklyn

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
